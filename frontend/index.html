<!doctype html><html><head><meta charset="utf-8"><title>PathSnap</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#111827;color:white;padding:22px 28px}main{max-width:1200px;margin:24px auto;padding:0 18px}.card{background:white;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 3px 16px #00000012}select,button{padding:10px 14px;border-radius:8px;border:1px solid #ccd3df}button{background:#111827;color:white;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:14px;background:#eef2ff;border-radius:10px}.metric b{font-size:24px;display:block}.map{height:520px;background:#e5e7eb;border-radius:12px;overflow:auto;padding:8px}.legend span{margin-right:18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2563eb}.ref{display:inline-block;width:24px;height:4px;background:#16a34a}.pred{display:inline-block;width:24px;height:4px;background:#dc2626}</style></head><body><header><h1>PathSnap</h1><div>GPS Trajectory Map Matching & Route Recovery</div></header><main><div class="card"><label>Student test trip </label><select id="trip"></select><button onclick="run()">Run map matching</button></div><div class="card"><div class="legend"><span><i class="dot"></i> GPS</span><span><i class="pred"></i> HMM prediction</span></div><div id="map" class="map"></div></div><div class="card"><div class="metrics"><div class="metric">Baseline Top-1<b id="b">—</b></div><div class="metric">HMM Top-1<b id="h">—</b></div><div class="metric">Route continuity<b id="c">—</b></div></div></div><div class="card"><pre id="log"></pre></div></main><script>
const API=localStorage.getItem('pathsnap_api')||'http://localhost:8000';
async function load(){let r=await fetch(API+'/trips');let j=await r.json();trip.innerHTML=j.trips.map(x=>`<option>${x}</option>`).join('');}
function project(lon,lat,minx,maxx,miny,maxy,w,h){let x=(lon-minx)/(maxx-minx)*w;let y=h-(lat-miny)/(maxy-miny)*h;return [x,y]}
function draw(j){let pts=j.gps, nodes=j.nodes, arcs=j.arcs;let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);let pad=.001;minx-=pad;maxx+=pad;miny-=pad;maxy+=pad;let w=1100,h=480;let svg=`<svg width="100%" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="background:#fff">`;for(let a of arcs){let p=nodes[a[0]],q=nodes[a[1]];let A=project(p[0],p[1],minx,maxx,miny,maxy,w,h),B=project(q[0],q[1],minx,maxx,miny,maxy,w,h);svg+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#d1d5db" stroke-width="1"/>`;}for(let p of pts){let A=project(p[0],p[1],minx,maxx,miny,maxy,w,h);svg+=`<circle cx="${A[0]}" cy="${A[1]}" r="2.5" fill="#2563eb"/>`;}function line(ids,stroke,width){let s='';for(let id of ids){let a=nodes[arcs[id][0]],q=nodes[arcs[id][1]],A=project(a[0],a[1],minx,maxx,miny,maxy,w,h),B=project(q[0],q[1],minx,maxx,miny,maxy,w,h);s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${stroke}" stroke-width="${width}" opacity=".85"/>`;}return s}svg+=line(j.predicted_arc_ids,'#dc2626',4)+`</svg>`;document.getElementById('map').innerHTML=svg}
async function run(){log.textContent='Requesting '+trip.value+' from '+API+'...';let r=await fetch(API+'/predict/'+trip.value);let j=await r.json();b.textContent=(j.baseline_point_accuracy*100).toFixed(1)+'%';h.textContent=(j.hmm_point_accuracy*100).toFixed(1)+'%';c.textContent=(j.hmm_route_continuity*100).toFixed(1)+'%';draw(j);log.textContent=JSON.stringify({trip_id:j.trip_id,n_observations:j.n_observations,baseline_point_accuracy:j.baseline_point_accuracy,hmm_point_accuracy:j.hmm_point_accuracy,hmm_route_continuity:j.hmm_route_continuity},null,2)}load();</script></body></html>
